nelmio_cors:
    defaults:
        allow_credentials: true
        allow_origin: ['https://playdoink.com', 'https://app.playdoink.com', 'http://local.playdoink.com', 'http://localhost:8080', 'http://127.0.0.1:8080']
        allow_headers: ['Content-Type', 'Authorization']
        allow_methods: ['GET', 'POST', 'OPTIONS']
        max_age: 3600
    paths:
        '^/': ~
