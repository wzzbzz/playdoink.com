<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MEGADO!NK playtest</title>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/megadoink.css">
  <link rel="stylesheet" href="css/share.css">
  <style>
    /* The page is exactly the visible screen height (dvh follows Safari's toolbars), so the game never scrolls. */
    html, body { height: 100%; }
    body {
      margin: 0; background: #f4f4f4; font-family: system-ui, sans-serif;
      height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
      padding-top: env(safe-area-inset-top); box-sizing: border-box;
    }
    .md-tune { flex: none; width: 100%; max-width: 420px; box-sizing: border-box; margin: 8px auto 0; padding: 0 16px; font-size: .85rem; color: #555; }
    #game-console { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .md-tune a { margin-right: 10px; color: #16871a; }
  </style>
</head>
<body>
  <!-- Playtest page: not linked from the live site. Try sizes with ?cols=3&rows=5&reds=1&lockMs=250&golden=0&seed=123 -->
  <div class="md-tune">
    <a href="/">&larr; Home</a>
  </div>
  <div id="game-console"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"
      integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/gameEngine.js"></script>
  <!-- loaded for its placement registry and seeded RNG; it only starts if loadGame('ultradoink') is called -->
  <script src="js/games/ultradoinkGame.js"></script>
  <script src="js/games/megadoinkGame.js"></script>
  <script>loadGame('megadoink');</script>
</body>
</html>
